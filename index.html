<!doctype html>
<!--
  So you got interested in how it works?
  You'll find nothing new here. But keep reading.
-->
<html lang="en" data-look="orbit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alex Matteo | Full-stack marketer</title>
  <meta name="description" content="Alex Matteo is a full-stack marketer based in Milan, specialized in paid advertising, media buying and conversion tracking.">
  <meta name="theme-color" content="#04060A">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://alexmatteo.me/">
  <meta property="og:title" content="Alex Matteo | Full-stack marketer">
  <meta property="og:description" content="Ask (almost) anything about Alex.">
  <meta property="og:image" content="https://alexmatteo.me/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/alex-wordmark.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/geist-300.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="chat.js"></script>
</head>
<body>
  <div class="app is-empty" id="app">
    <!-- The sky. Only Alex's look has one; the other two work indoors. -->
    <div class="sky" aria-hidden="true">
      <canvas id="stars"></canvas>
      <canvas id="meteors"></canvas>
      <div class="planet"></div>
    </div>

    <header class="topbar">
      <button type="button" class="wordmark" id="wordmark" aria-label="Alex Matteo, start over">Alex Matteo</button>
      <button type="button" class="model-picker" id="model-picker" aria-haspopup="menu" aria-expanded="false">
        <span id="model-name">Aldebaran 5</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="chat-title" id="chat-title"></div>
      <div class="topbar-actions">
        <button type="button" class="icon-button" id="new-chat" aria-label="New chat" title="New chat">
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M9 3.5H5.5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V11M14.2 3.3a1.6 1.6 0 0 1 2.3 2.3L10 12.1l-3 .8.8-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="look-switch" id="look-switch"><span id="look-switch-emoji" aria-hidden="true">🦀</span></button>
        <button type="button" class="icon-button theme-toggle" id="theme-toggle"></button>
      </div>
    </header>

    <main class="main">
      <div class="thread" id="thread">
        <div class="messages" id="messages" aria-live="polite"></div>
      </div>

      <div class="dock">
        <div class="dock-inner">
          <div class="hero">
            <h1 class="greeting"><span class="greeting-mark" aria-hidden="true">🦀</span><span id="greeting">Ask (almost) anything about Alex</span></h1>
          </div>

          <div class="limit-banner" id="limit-banner" hidden>
            <span id="limit-text"></span>
            <button type="button" id="upgrade">Upgrade now</button>
          </div>

          <form class="composer" id="composer" autocomplete="off">
            <textarea id="prompt" rows="1" aria-label="Your question" placeholder="Who is Alex?"></textarea>
            <!-- Attach files. Attaches nothing. Like most attachments. -->
            <p class="toast" id="toast" role="status" hidden></p>
            <button type="button" class="icon-button attach" id="attach" aria-label="Attach files">
              <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <!-- Takes the suggested question. Tab does the same, for people with keyboards and opinions. -->
            <button type="button" class="use" id="use" hidden><span class="use-keys">Tab ⇥</span><span class="use-touch">Use</span></button>
            <button type="button" class="model-inline" id="model-inline" aria-haspopup="menu" aria-expanded="false"><span id="model-inline-name">Epic 7</span> ⌄</button>
            <button type="submit" class="send" id="send" aria-label="Send">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>

          <div class="suggestions" id="suggestions">
            <button type="button">Who is Alex?</button>
            <button type="button">Where is Alex from?</button>
            <button type="button">What is Alex working on?</button>
            <button type="button">How do I reach Alex?</button>
            <button type="button">Who are you?</button>
            <button type="button">Surprise me</button>
          </div>

          <p class="disclaimer" id="disclaimer"></p>
        </div>
      </div>
    </main>

    <footer class="page-footer">
      <div class="looks">
        <button type="button" class="look-option" id="look-option-1">Switch to CheapET 🪢</button>
        <button type="button" class="look-option" id="look-option-2">Switch to Clawdio 🦀</button>
      </div>
      <!-- Required by Italian law. Also, hi, tax office. -->
      <p class="legal">© <span id="year">2026</span> Alex Matteo – <button type="button" class="piva" id="piva" title="Copy">P.IVA: IT08886490963</button></p>
    </footer>
  </div>

  <div class="model-menu" id="model-menu" role="menu" aria-label="Choose a model" hidden></div>

  <noscript>
    <p style="text-align:center">This assistant runs on JavaScript. Turn it on, or ask Alex in person.</p>
  </noscript>
</body>
</html>
